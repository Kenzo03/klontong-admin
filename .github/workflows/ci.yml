name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:                                  # a throwaway Postgres just for this run
        image: postgres:17-alpine
        env:
          POSTGRES_USER: klontong
          POSTGRES_PASSWORD: klontong
          POSTGRES_DB: klontong
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U klontong"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:                                         # replaces .env (never committed)
      DATABASE_URL: postgresql://klontong:klontong@127.0.0.1:5432/klontong
      DATABASE_URL_TEST: postgresql://klontong:klontong@127.0.0.1:5432/klontong_test
      JWT_SECRET: ci-only-secret-at-least-32-characters-long
      JWT_TTL_SECONDS: '28800'
      UPLOAD_DIR: ./uploads
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4               # reads "packageManager": "pnpm@12.14.0" from package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
      - run: pnpm install --frozen-lockfile      # fails if pnpm-lock.yaml is out of date
      - run: pnpm --filter ./apps/backend lint
      - run: pnpm --filter ./apps/backend exec tsc --noEmit
      - run: pnpm --filter ./apps/backend test
      - run: pnpm --filter ./apps/backend test:e2e
      - run: pnpm -r build                       # backend and frontend both build